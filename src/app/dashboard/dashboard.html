<div class="min-h-screen bg-bg text-ink font-body antialiased relative">
  <div class="dashboard-grid absolute inset-0 opacity-70" aria-hidden="true"></div>

  <div class="relative z-10 flex min-h-screen">
    <aside class="dashboard-sidebar">
      <a routerLink="/" class="sidebar-brand" aria-label="Linkly home">
        <span class="font-display font-bold text-xl tracking-tight">Linkly</span
        ><span class="font-mono text-xl text-accent font-medium">/</span>
      </a>

      <div class="sidebar-workspace">
        <span class="status-dot"></span>
        <div>
          <strong>Demo workspace</strong>
          <p>Professional preview</p>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Dashboard demo pages">
        <a routerLink="/dashboard/link-short" routerLinkActive="is-active" class="sidebar-link">
          <span class="sidebar-icon">↗</span><span>Link Short</span><em>248</em>
        </a>
        <a routerLink="/dashboard/qr-code" routerLinkActive="is-active" class="sidebar-link">
          <span class="sidebar-icon">▦</span><span>QR Code</span><em>96</em>
        </a>
        <a routerLink="/dashboard/analytics-link" routerLinkActive="is-active" class="sidebar-link">
          <span class="sidebar-icon">⌁</span><span>Analytics Link</span><em>12.4K</em>
        </a>
        <a
          routerLink="/dashboard/analytics-qr-code"
          routerLinkActive="is-active"
          class="sidebar-link"
        >
          <span class="sidebar-icon">◫</span><span>Analytics QR Code</span><em>3.9K</em>
        </a>
        <a routerLink="/dashboard/expiring-links" routerLinkActive="is-active" class="sidebar-link">
          <span class="sidebar-icon">⏱</span><span>Expiring Links</span><em>17</em>
        </a>
        <a
          routerLink="/dashboard/expiring-qr-codes"
          routerLinkActive="is-active"
          class="sidebar-link"
        >
          <span class="sidebar-icon">⌛</span><span>Expiring QR Codes</span><em>11</em>
        </a>
      </nav>

      <div class="sidebar-upgrade-card">
        <p>Demo version</p>
        <strong>All pages are crafted as realistic product previews.</strong>
      </div>
    </aside>

    <div class="dashboard-content">
      <header class="dashboard-topbar">
        <div>
          <p class="font-mono text-xs tracking-[0.14em] uppercase text-accent font-medium">
            Linkly cockpit
          </p>
          <h2>Dashboard</h2>
        </div>
        <button type="button" (click)="logout()" class="dashboard-logout-button">Log out</button>
      </header>

      <main class="dashboard-main">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
